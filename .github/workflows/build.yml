name: Web Build and Deploy

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  DOTNET_VERSION: "10.x"
  MIN_LINE_COVERAGE: "70"
  WEB_SOLUTION_FILE: SchoolAccount.Web.slnx
  MAIN_BRANCH: refs/heads/main
  IMAGE_NAME: ghcr.io/paulcustance-al/schoolaccount-web-forktest # FORK TEST

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest

    permissions:
      contents: read
      checks: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore ${{ env.WEB_SOLUTION_FILE }}

      - name: Check formatting
        run: |
          dotnet tool restore
          dotnet csharpier check .

      - name: Build
        run: dotnet build ${{ env.WEB_SOLUTION_FILE }} --configuration Release --no-restore

      - name: Test
        run: dotnet test ${{ env.WEB_SOLUTION_FILE }} --configuration Release --no-restore --no-build -- --report-trx --coverage --coverage-output-format cobertura --coverage-settings ${{ github.workspace }}/coverage.config

      - name: Test report
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: ${{ !cancelled() }}
        with:
          files: "TestResults/*.trx"

      - name: Merge coverage reports and enforce threshold
        if: ${{ !cancelled() }}
        uses: danielpalme/ReportGenerator-GitHub-Action@5
        with:
          reports: "TestResults/*.cobertura.xml"
          targetdir: TestResults/Merged
          reporttypes: "Cobertura;MarkdownSummaryGithub"
          customSettings: "minimumCoverageThresholds:lineCoverage=${{ env.MIN_LINE_COVERAGE }}"

      - name: Write coverage job summary
        if: ${{ !cancelled() }}
        run: cat TestResults/Merged/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"

      - name: Add coverage comment to PR
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          path: TestResults/Merged/SummaryGithub.md

  image:
    name: Create Image
    needs: test
    runs-on: ubuntu-latest

    outputs:
      image: ${{ steps.image.outputs.image }}

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha
            type=raw,value=latest,enable=${{ github.ref == env.MAIN_BRANCH }}
            type=ref,event=branch
            
      - name: Get SHA image tag
        id: image
        run: |
          IMAGE=$(echo "${{ steps.meta.outputs.tags }}" | grep "sha-" | head -n 1)
          echo "image=$IMAGE" >> $GITHUB_OUTPUT
          
      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: src/SchoolAccount.Web.Mvc/Dockerfile
          target: final
          load: true
          tags: ${{ steps.meta.outputs.tags }}

      - name: Log in to GHCR
        if: ${{ github.event_name == 'push' && github.ref == env.MAIN_BRANCH }}
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Docker image
        if: ${{ github.event_name == 'push' && github.ref == env.MAIN_BRANCH }}
        run: docker push --all-tags "$IMAGE_NAME"

  release:
    name: Create Release
    needs: image
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest

    outputs:
      version: ${{ steps.version.outputs.version }}

    permissions:
      contents: write
      packages: write

    # One release at a time, so two pushes on the same day can't claim the same version
    concurrency:
      group: release
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Versions are vYYYY.MM.DD.N. A rerun reuses the version this commit already has.
      - name: Work out version
        id: version
        run: |
          EXISTING=$(git tag --points-at HEAD --list 'v*' | head -n 1)
          if [ -n "$EXISTING" ]; then
            echo "Commit is already released as $EXISTING"
            echo "version=$EXISTING" >> "$GITHUB_OUTPUT"
            echo "exists=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          TODAY="v$(date -u +%Y.%m.%d)"
          LAST=$(git tag --list "$TODAY.*" | awk -F. '{ print $NF }' | sort -n | tail -n 1)
          VERSION="$TODAY.$(( ${LAST:-0} + 1 ))"
          echo "Releasing $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "exists=false" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag image with version
        env:
          IMAGE: ${{ needs.image.outputs.image }}
          VERSION: ${{ steps.version.outputs.version }}
        run: docker buildx imagetools create --tag "$IMAGE_NAME:$VERSION" "$IMAGE"

      - name: Create GitHub release
        if: ${{ steps.version.outputs.exists == 'false' }}
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: gh release create "$VERSION" --target "$GITHUB_SHA" --title "$VERSION" --generate-notes

  # Each environment deploys in its own Web Deploy run from the release tag, so any
  # deploy can be rerun on its own and the Environments page shows the version.
  deploy:
    name: Start Deploy To Dev
    needs: release
    runs-on: ubuntu-latest

    permissions:
      actions: write

    steps:
      - name: Start deploy
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          gh workflow run deploy.yml --repo "$GITHUB_REPOSITORY" --ref "$VERSION" -f environment=dev -f promote=true
          echo "Started deploy of $VERSION to **dev**. Pre-prod and prod follow as separate Web Deploy runs." >> "$GITHUB_STEP_SUMMARY"
