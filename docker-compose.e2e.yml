# Runs the web app against navikt/mock-oauth2-server instead of DfE Sign-in.
# Use it on top of the other compose files:
#   docker compose -f docker-compose.yml -f docker-compose.override.yml -f docker-compose.e2e.yml up --build
services:
  web:
    ports:
      # The mock shares this container's network, so its port is published here.
      - "5200:5200"
    environment:
      # The mock serves one issuer per path; "default" is used here.
      - OpenIDConnectSettings__Authority=http://localhost:5200/default
      - OpenIDConnectSettings__ClientId=school-account-local
      # The mock speaks plain HTTP.
      - Authentication__Schemes__OpenIdConnect__RequireHttpsMetadata=false

  mock-oauth2-server:
    image: ghcr.io/navikt/mock-oauth2-server:6.1.2
    container_name: mock-oauth2-server
    # The mock builds its issuer from the request's host. Sharing the web
    # container's network means the app and the browser both reach it at
    # http://localhost:5200, so the issuer always matches.
    network_mode: "service:web"
    environment:
      SERVER_PORT: 5200
      # Shows a login page taking any username and a JSON object of claims,
      # so each test chooses its academy when it signs in.
      JSON_CONFIG: '{"interactiveLogin": true}'
